name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Static Assets
        run: npm run build

      - name: Install Playwright Chromium
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium

      - name: Run End-to-End Tests
        run: node --test --test-concurrency=1 tests/e2e/demo.e2e.mjs
